[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datamate"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1,<2", "pandas>=2.2,<3", "openpyxl>=3.1,<4", "PyYAML>=6,<7", "pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
datamate = "datamate.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "synth"]
testpaths = ["tests"]
